# Build, scan and publish the portal image to GHCR, then deploy it by Git:
# the sha-<commit> tag is committed to the platform repo and Argo CD rolls it
# out. `main` always points at the latest image.
name: build-image

on:
  push:
    branches: [main]
    paths-ignore: ["templates/**", "docs/**", "org/**", "*.md", "catalog-info.yaml", ".github/workflows/dotnet-service.yaml", ".github/workflows/container-service.yaml", ".github/actions/service-contract/**"]
  pull_request:
    paths-ignore: ["templates/**", "docs/**", "org/**", "*.md", "catalog-info.yaml", ".github/workflows/dotnet-service.yaml", ".github/workflows/container-service.yaml", ".github/actions/service-contract/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Enable Yarn
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Type-check
        run: yarn tsc

      - name: Test
        run: yarn test:all --passWithNoTests

      - name: Build backend bundle
        run: yarn build:backend

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/backend/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Push only if no fixable critical vulnerabilities
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: docker push --all-tags "$IMAGE"

  # The portal deploys itself like every service: one commit to the platform repo
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-portal
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gitops-update
        with:
          repository: ${{ vars.GITOPS_REPOSITORY }}
          file: charts/developer-portal/values-image.yaml
          key: .backstage.backstage.image.tag
          value: sha-${{ github.sha }}
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
