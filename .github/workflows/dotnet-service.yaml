# Reusable CI for services created from the dotnet-service template.
# Fix or upgrade it here once and every service picks it up on its next run.
#
# Build -> test -> image -> scan -> push ghcr.io/<owner>/<repo>:sha-<commit>
# -> deploy-dev: commit the new tag to the platform repo; Argo CD rolls it out.
# GHCR uses the caller's built-in GITHUB_TOKEN; the deploy commit uses the
# GitOps GitHub App (variable GITOPS_APP_ID, secret GITOPS_APP_PRIVATE_KEY).
name: dotnet-service

on:
  workflow_call:
    inputs:
      project-path:
        description: Folder containing the .csproj
        type: string
        required: true
      dotnet-version:
        type: string
        default: "10.0.x"
      gitops-repository:
        description: Platform repo name (same owner); empty = don't deploy
        type: string
        default: ""
      gitops-values-file:
        description: The service's dev values in the platform repo
        type: string
        default: ""
      gitops-app-id:
        type: string
        default: ""
    secrets:
      GITOPS_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - run: dotnet restore ${{ inputs.project-path }}
      - run: dotnet build ${{ inputs.project-path }} -c Release --no-restore
      - run: dotnet test ${{ inputs.project-path }} -c Release --no-build

  image:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long,prefix=sha-

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Push only if no fixable critical vulnerabilities
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${{ steps.meta.outputs.tags }}"

  # Deploy to dev by Git: the new tag goes into the platform repo, Argo CD
  # rolls it out. Only for main, and only once the image is published.
  deploy-dev:
    needs: image
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && inputs.gitops-repository != '' && inputs.gitops-values-file != ''
    runs-on: ubuntu-latest
    # One deploy at a time per service, in push order
    concurrency:
      group: deploy-dev-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: sfy247/omarchy-k8s-portal/.github/actions/gitops-update@main
        with:
          repository: ${{ inputs.gitops-repository }}
          file: ${{ inputs.gitops-values-file }}
          key: .image.tag
          value: sha-${{ github.sha }}
          app-id: ${{ inputs.gitops-app-id }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
