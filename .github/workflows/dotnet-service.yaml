# Reusable CI for services created from the dotnet-service template.
# Fix or upgrade it here once and every service picks it up on its next run.
#
# Build -> test (.NET), then container-service.yaml: image -> Service Contract
# check -> scan -> push ghcr.io/<owner>/<repo>:sha-<commit> -> deploy-dev
# (commit the new tag to the platform repo; Argo CD rolls it out).
# GHCR uses the caller's built-in GITHUB_TOKEN; the deploy commit uses the
# GitOps GitHub App (variable GITOPS_APP_ID, secret GITOPS_APP_PRIVATE_KEY).
name: dotnet-service

on:
  workflow_call:
    inputs:
      project-path:
        description: Folder containing the .csproj
        type: string
        required: true
      dotnet-version:
        type: string
        default: "10.0.x"
      gitops-repository:
        description: Platform repo name (same owner); empty = don't deploy
        type: string
        default: ""
      gitops-values-file:
        description: The service's dev values in the platform repo
        type: string
        default: ""
      gitops-app-id:
        type: string
        default: ""
    secrets:
      GITOPS_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - run: dotnet restore ${{ inputs.project-path }}
      - run: dotnet build ${{ inputs.project-path }} -c Release --no-restore
      - run: dotnet test ${{ inputs.project-path }} -c Release --no-build

  # Everything after build and tests is the same for every language
  container:
    needs: build-test
    permissions:
      contents: read
      packages: write
    uses: sfy247/omarchy-k8s-portal/.github/workflows/container-service.yaml@main
    with:
      project-path: "."
      gitops-repository: ${{ inputs.gitops-repository }}
      gitops-values-file: ${{ inputs.gitops-values-file }}
      gitops-app-id: ${{ inputs.gitops-app-id }}
    secrets:
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
