# Production settings shared by every deployment of this portal.
#
# Nothing environment-specific lives here. The deployment adds one more file,
# app-config.lab.yaml, generated by the provisioning tooling from its settings:
# base URLs, GitHub integration, catalog locations, Kubernetes clusters, and
# auth providers. Secrets arrive as environment variables, never in Git.

app:
  title: Developer Portal

backend:
  # Object form, matching app-config.yaml (config merging rejects mixed types)
  listen:
    port: 7007
  database:
    client: pg
    # One database owned by Backstage, one schema per plugin, so Backstage
    # never needs permission to create databases
    pluginDivisionMode: schema
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DB}
      # TLS, verified against the database cluster's own CA
      ssl:
        rejectUnauthorized: true
        ca:
          $file: /etc/postgres-ca/ca.crt

  # External access (static tokens for automation) is configured by the
  # deployment in app-config.lab.yaml

catalog:
  # Locations come from app-config.lab.yaml; no demo data in production
  locations: []
  # Approved templates only: no Template here, so templates are accepted solely
  # from the portal repo's templates/ location (merged through review)
  rules:
    - allow: [Component, System, API, Resource, Location, Group, User, Domain]

scaffolder:
  defaultAuthor:
    name: Developer Portal
    email: portal@users.noreply.github.com
  defaultCommitMessage: 'chore: scaffolded by the developer portal'

techdocs:
  # Docs are built inside the backend container (mkdocs is in the image)
  builder: local
  generator:
    runIn: local
  publisher:
    type: local
    local:
      # The root filesystem is read-only; /tmp is a writable volume
      publishDirectory: /tmp/techdocs

kubernetes:
  # Find a component's workloads by its backstage.io/kubernetes-id label in
  # every namespace; clusters come from app-config.lab.yaml
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters: []

permission:
  enabled: true

search:
  # Index after the catalog has had time to load at startup, then keep fresh
  collators:
    catalog:
      schedule:
        initialDelay: { seconds: 90 }
        frequency: { minutes: 5 }
        timeout: { minutes: 15 }
    techdocs:
      schedule:
        initialDelay: { seconds: 120 }
        frequency: { minutes: 5 }
        timeout: { minutes: 15 }
