apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dotnet-service
  title: .NET web service
  description: >-
    C# minimal API with health checks, JSON logs, a hardened container image
    and CI, deployed by GitOps: one form creates the service repo and opens one
    pull request in the platform repo that deploys it to dev over HTTPS.
  tags: [dotnet, csharp, kubernetes, argocd, recommended]
spec:
  owner: group:default/platform-team
  type: service

  parameters:
    - title: Service
      required: [name, description, owner, group]
      properties:
        name:
          title: Name
          type: string
          description: Lowercase letters, digits and dashes. Used for the repo, image, and hostname.
          pattern: "^[a-z][a-z0-9-]{2,30}$"
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owning team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        group:
          title: App group
          description: The platform group (and Kubernetes namespace) the service joins.
          type: string
          enum: [services]
          default: services
        database:
          title: PostgreSQL database
          description: >-
            Lets the service reach the shared Postgres and load its connection
            details. A platform engineer then runs `make database APP=<group>/<name>`.
          type: boolean
          default: false

    - title: Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [github.com]

  steps:
    # Platform repo coordinates come from the catalog, not this file
    - id: platform
      name: Look up the platform repo
      action: catalog:fetch
      input:
        entityRef: resource:default/platform-gitops-repo

    - id: fetch-service
      name: Generate service code
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./service
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          database: ${{ parameters.database }}
          repoOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          workflowsRepo: ${{ steps['platform'].output.entity.metadata.annotations['platform.lab/portal-workflows'] }}
          namespace: ${{ parameters.name | replace('-', ' ') | title | replace(' ', '') }}

    - id: publish
      name: Create the service repo
      action: publish:github
      input:
        sourcePath: ./service
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        # Public: free Actions minutes and the cluster pulls images without credentials
        repoVisibility: public
        deleteBranchOnMerge: true
        protectDefaultBranch: false

    - id: fetch-gitops
      name: Generate deployment
      action: fetch:template
      input:
        url: ./gitops
        targetPath: ./gitops
        values:
          name: ${{ parameters.name }}
          group: ${{ parameters.group }}
          database: ${{ parameters.database }}
          image: ghcr.io/${{ (parameters.repoUrl | parseRepoUrl).owner | lower }}/${{ (parameters.repoUrl | parseRepoUrl).repo | lower }}

    - id: gitops-pr
      name: Open the deployment pull request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=${{ steps['platform'].output.entity.metadata.annotations['platform.lab/repo-owner'] }}&repo=${{ steps['platform'].output.entity.metadata.annotations['platform.lab/repo-name'] }}
        branchName: portal/add-${{ parameters.name }}
        title: "Deploy ${{ parameters.name }} to dev"
        description: |
          Created by the developer portal for ${{ parameters.owner }}.

          - `apps/${{ parameters.group }}/${{ parameters.name }}/`: values for the web-service chart
          - `environments/dev/${{ parameters.group }}/image-updates/${{ parameters.name }}.yaml`: keeps dev on the newest image

          After merging, Argo CD deploys it to `https://${{ parameters.name }}.dev.<lab domain>`.
          Database requested: ${{ parameters.database }}. If true, run
          `make database APP=${{ parameters.group }}/${{ parameters.name }}` in omarchy-k8s-ansible.
        sourcePath: ./gitops

    - id: register
      name: Register in the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Service repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Deployment pull request
        url: ${{ steps['gitops-pr'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
