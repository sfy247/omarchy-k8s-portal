# The Create flow, one stage per step (the shared blocks live in templates/_shared):
#   1 Create application   2 Select approved template (this one)
#   3 Configure application (the form)   4 Create GitHub repo
#   5 Generate CI/CD   6 Provision infrastructure   7 Deploy application
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dotnet-service
  title: .NET web service
  description: >-
    C# minimal API with health checks, metrics and JSON logs. Creates the
    GitHub repo, generates CI/CD, provisions its infrastructure and deploys it
    to dev over HTTPS, all reviewed through one platform pull request.
  tags: [dotnet, csharp, kubernetes, argocd, observability, approved]
spec:
  owner: group:default/platform-team
  type: service

  parameters:
    - title: Configure application
      required: [name, description, owner, group]
      properties:
        name:
          title: Name
          type: string
          description: Lowercase letters, digits and dashes. Used for the repo, image, and hostname.
          pattern: "^[a-z][a-z0-9-]{2,30}$"
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owning team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        group:
          title: App group
          description: The platform group (and Kubernetes namespace) the service joins.
          type: string
          enum: [services]
          default: services

    - title: GitHub repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [github.com]

    - title: Infrastructure and deployment
      properties:
        database:
          title: PostgreSQL database
          description: >-
            The service gets its own Postgres database and login, created when
            the platform pull request merges. It logs in with a client
            certificate (no passwords); settings arrive as PG* variables.
          type: boolean
          default: false
        deploy:
          title: Provision and deploy to dev now
          description: >-
            Untick to create only the repo and CI; provision and deploy later
            with "Deploy a service".
          type: boolean
          default: true

  steps:
    - id: platform
      name: Look up platform settings
      action: catalog:fetch
      input:
        entityRef: resource:default/platform-gitops-repo

    # You can create services for your own team(s) only
    - id: authorize
      name: Check you're in the owning team
      action: platform:authorize
      input:
        owner: ${{ parameters.owner }}

    # ---- Create GitHub repo ----
    - id: repo
      name: Create GitHub repo
      action: github:repo:create
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        # Public: free Actions minutes and the cluster pulls images without credentials
        repoVisibility: public
        deleteBranchOnMerge: true

    # CD credentials before the first push, so the first CI run can deploy
    - id: ci-credentials
      name: Generate CI/CD (deploy credentials)
      action: platform:ci-credentials
      input:
        repoUrl: ${{ parameters.repoUrl }}

    - id: code
      name: Generate application code
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./service
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          group: ${{ parameters.group }}
          database: ${{ parameters.database }}
          repoOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          namespace: ${{ parameters.name | replace('-', ' ') | title | replace(' ', '') }}

    # ---- Generate CI/CD ----
    - id: ci
      name: Generate CI/CD (pipeline)
      action: fetch:template
      input:
        url: ${{ steps['platform'].output.entity.metadata.annotations['platform.lab/building-blocks'] }}/cicd/repo
        targetPath: ./service
        values:
          language: dotnet
          projectPath: src/${{ parameters.name }}
          name: ${{ parameters.name }}
          group: ${{ parameters.group }}
          workflowsRepo: ${{ steps['platform'].output.entity.metadata.annotations['platform.lab/portal-workflows'] }}

    # Pushing starts the first CI run, which publishes the first image
    - id: publish
      name: Push code and pipeline to the repo
      action: github:repo:push
      input:
        repoUrl: ${{ parameters.repoUrl }}
        sourcePath: ./service
        defaultBranch: main
        protectDefaultBranch: false

    # ---- Provision infrastructure ----
    - id: infra
      name: Provision infrastructure
      if: ${{ parameters.deploy }}
      action: fetch:template
      input:
        url: ${{ steps['platform'].output.entity.metadata.annotations['platform.lab/building-blocks'] }}/infra
        targetPath: ./platform
        values:
          name: ${{ parameters.name }}
          group: ${{ parameters.group }}
          database: ${{ parameters.database }}
          image: ghcr.io/${{ (parameters.repoUrl | parseRepoUrl).owner | lower }}/${{ (parameters.repoUrl | parseRepoUrl).repo | lower }}

    # ---- Deploy application ----
    - id: deploy
      name: Deploy application to dev
      if: ${{ parameters.deploy }}
      action: fetch:template
      input:
        url: ${{ steps['platform'].output.entity.metadata.annotations['platform.lab/building-blocks'] }}/deploy
        targetPath: ./platform
        values:
          name: ${{ parameters.name }}
          group: ${{ parameters.group }}
          environment: dev
          # CI publishes sha-<commit> for the commit just pushed
          imageTag: sha-${{ steps['publish'].output.commitHash }}

    - id: platform-pr
      name: Open the platform pull request (infrastructure + deployment)
      if: ${{ parameters.deploy }}
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=${{ steps['platform'].output.entity.metadata.annotations['platform.lab/repo-owner'] }}&repo=${{ steps['platform'].output.entity.metadata.annotations['platform.lab/repo-name'] }}
        branchName: portal/create-${{ parameters.name }}
        title: "Provision and deploy ${{ parameters.name }} to dev"
        commitMessage: "Provision and deploy ${{ parameters.name }} to dev"
        description: |
          Created by the developer portal for ${{ parameters.owner }}.

          | Stage | File |
          |---|---|
          | Provision infrastructure | `apps/${{ parameters.group }}/${{ parameters.name }}/values.yaml` |
          | Deploy application | `apps/${{ parameters.group }}/${{ parameters.name }}/values-dev.yaml` |

          After merging, Argo CD deploys it to `https://${{ parameters.name }}.dev.<lab domain>`.
          Database requested: ${{ parameters.database }} (created on merge; login by client certificate).
        sourcePath: ./platform

    - id: register
      name: Register in the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    text:
      - title: Next steps
        content: |
          The first CI run is building and publishing the image now.
          {%- if parameters.deploy %} Merge the platform pull request: Argo CD then
          provisions and deploys the service to dev.{% else %}
          When you're ready, provision and deploy it with **Create → Deploy a service**.{% endif %}
    links:
      - title: GitHub repository
        url: ${{ steps['repo'].output.remoteUrl }}
      - title: Platform pull request
        if: ${{ parameters.deploy }}
        url: ${{ steps['platform-pr'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
