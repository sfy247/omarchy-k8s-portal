# Operate → Request action: Add a database. Changes the service's platform values
# through a reviewed pull request; Argo CD applies it once merged.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: add-database
  title: Add a database
  description: >-
    Give a service its own Postgres database: created on merge, login by client
    certificate (no passwords).
  tags: [operate, kubernetes, approved]
spec:
  owner: group:default/platform-team
  type: operation

  parameters:
    - title: Database
      required: [service, environment]
      properties:
        service:
          title: Service
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Component
              spec.type: service
            defaultKind: Component
            allowArbitraryValues: false
        environment:
          title: Environment
          type: string
          enum: [dev]
          default: dev
        migrations:
          title: Run its migrations before each deploy
          description: >-
            Tick if the service's repo has db/migrations (V1__….sql files); CI
            then publishes a migrations image and each deploy applies new ones
            first. You can add this later.
          type: boolean
          default: false

  steps:
    - id: platform
      name: Look up the platform repo
      action: catalog:fetch
      input:
        entityRef: resource:default/platform-gitops-repo

    # The service's folder in the platform repo: apps/<group>/<app label>
    - id: service
      name: Look up the service
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.service }}

    # Only the service's owners (or the platform team) may change it
    - id: authorize
      name: Check you own this service
      action: platform:authorize
      input:
        owner: ${{ steps['service'].output.entity.spec.owner }}

    - id: values
      name: Update the platform values
      action: platform:values:set
      input:
        url: https://github.com/${{ steps['platform'].output.entity.metadata.annotations['platform.lab/repo-owner'] }}/${{ steps['platform'].output.entity.metadata.annotations['platform.lab/repo-name'] }}/blob/main/apps/${{ steps['service'].output.entity.spec.system }}/${{ steps['service'].output.entity.metadata.annotations['backstage.io/kubernetes-label-selector'] | replace('app.kubernetes.io/name=', '') }}/values.yaml
        targetPath: ./platform/apps/${{ steps['service'].output.entity.spec.system }}/${{ steps['service'].output.entity.metadata.annotations['backstage.io/kubernetes-label-selector'] | replace('app.kubernetes.io/name=', '') }}/values.yaml
        set:
          database.enabled: true
          migrations.enabled: ${{ parameters.migrations }}

    - id: platform-pr
      name: Open the pull request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=${{ steps['platform'].output.entity.metadata.annotations['platform.lab/repo-owner'] }}&repo=${{ steps['platform'].output.entity.metadata.annotations['platform.lab/repo-name'] }}
        branchName: portal/database-${{ steps['service'].output.entity.metadata.annotations['backstage.io/kubernetes-label-selector'] | replace('app.kubernetes.io/name=', '') }}-${{ parameters.environment }}-${{ context.task.id | truncate(8, true, '') }}
        title: "Database access for ${{ steps['service'].output.entity.metadata.annotations['backstage.io/kubernetes-label-selector'] | replace('app.kubernetes.io/name=', '') }}"
        commitMessage: "Database access for ${{ steps['service'].output.entity.metadata.annotations['backstage.io/kubernetes-label-selector'] | replace('app.kubernetes.io/name=', '') }}"
        description: |
          Sets `database.enabled: true` (and `migrations.enabled: ${{ parameters.migrations }}`) in `values.yaml` (every environment).

          On merge, Argo CD creates the service's own database and login, and a
          client certificate it logs in with (no passwords). The pods get PG*
          connection settings and restart with the certificate mounted.

          Requested in the developer portal (Operate) for `${{ parameters.service }}`.
        sourcePath: ./platform

  output:
    links:
      - title: Pull request
        url: ${{ steps['platform-pr'].output.remoteUrl }}
      - title: Back to Operate
        url: /operate?app=${{ parameters.service | urlencode }}&env=${{ parameters.environment }}
