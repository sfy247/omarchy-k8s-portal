# ${{ values.name }}: values for the platform's web-service chart (all environments).
# Created by the developer portal (templates/_shared/infra).
nameOverride: ${{ values.name }}

image:
  repository: ${{ values.image }}
  tag: bootstrap   # each environment's values-<env>.yaml sets the running tag

containerPort: 8080

# Request metrics at /metrics (every service template provides them), scraped
# via a PodMonitor: Grafana's Service Health dashboard and app alerts use them
metrics:
  enabled: true

resources:
  requests: { cpu: 50m, memory: 96Mi }
  limits: { memory: 256Mi }
{%- if values.database %}

# Its own Postgres database and login; connects with a client certificate
database:
  enabled: true
{%- endif %}
{%- if values.migrations %}

# Apply db/migrations before each rollout (migrate job, same tag as the app)
migrations:
  enabled: true
{%- endif %}
