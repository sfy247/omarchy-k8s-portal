# Generated by the developer portal (templates/_shared/cicd).
# Thin caller: build, test, scan and publish live in the platform's reusable
# workflow, so every service gets fixes in one place. The image goes to GHCR
# with the built-in token; deploying it to dev is a commit to the platform repo
# by the GitOps GitHub App.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ${{ values.workflowsRepo }}/.github/workflows/${{ values.language }}-service.yaml@main
    with:
      project-path: ${{ values.projectPath }}
      # Continuous delivery: after main publishes an image, its tag is committed
      # to this service's dev values in the platform repo (Argo CD deploys it).
      # The portal sets these repo variables and the secret when it creates the repo.
      gitops-repository: {% raw %}${{ vars.GITOPS_REPOSITORY }}{% endraw %}
      gitops-values-file: apps/${{ values.group }}/${{ values.name }}/values-dev.yaml
      gitops-app-id: {% raw %}${{ vars.GITOPS_APP_ID }}{% endraw %}
    secrets:
      GITOPS_APP_PRIVATE_KEY: {% raw %}${{ secrets.GITOPS_APP_PRIVATE_KEY }}{% endraw %}
