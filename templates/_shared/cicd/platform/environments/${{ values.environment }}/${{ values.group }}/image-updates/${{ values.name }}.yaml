# Rolls ${{ values.name }} forward in ${{ values.environment }}: when CI publishes a newer sha-<commit>
# image, Image Updater commits the tag to values-${{ values.environment }}.yaml and Argo CD deploys it.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  annotations:
    # The ImageUpdater CRD is installed by an app synced alongside this one
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: ${{ values.group }}-${{ values.name }}-${{ values.environment }}
  namespace: argocd
spec:
  writeBackConfig:
    method: git:secret:argocd/image-updater-git
    gitConfig:
      branch: main
      writeBackTarget: helmvalues:/apps/${{ values.group }}/${{ values.name }}/values-${{ values.environment }}.yaml
  applicationRefs:
    - namePattern: ${{ values.group }}-${{ values.name }}-${{ values.environment }}
      images:
        - alias: app
          imageName: ${{ values.image }}
          commonUpdateSettings:
            updateStrategy: newest-build
            # Update even before the app reports the image as running (first
            # rollout, or while a broken version is crash-looping)
            forceUpdate: true
            allowTags: regexp:^sha-[0-9a-f]{40}$
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
