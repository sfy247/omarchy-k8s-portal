apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ${{ values.name }}
  title: ${{ values.title }}
  description: ${{ values.description }}
spec:
  owner: ${{ values.owner }}
  type: ${{ values.kind }}
  parameters:
    - title: Basics
      required: [name]
      properties:
        name:
          title: Name
          type: string
          pattern: "^[a-z][a-z0-9-]{2,30}$"
    - title: Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [github.com]
  steps:
    - id: fetch
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: {% raw %}${{ parameters.name }}{% endraw %}
    - id: publish
      action: publish:github
      input:
        repoUrl: {% raw %}${{ parameters.repoUrl }}{% endraw %}
        repoVisibility: public
    - id: register
      action: catalog:register
      input:
        repoContentsUrl: {% raw %}${{ steps['publish'].output.repoContentsUrl }}{% endraw %}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Repository
        url: {% raw %}${{ steps['publish'].output.remoteUrl }}{% endraw %}
