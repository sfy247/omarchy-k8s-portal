apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-template
  title: New golden-path template
  description: >-
    Scaffolds a new template folder in the portal repo and opens a pull request.
    Merge it and the template appears in the portal.
  tags: [platform, meta]
spec:
  owner: group:default/platform-team
  type: template

  parameters:
    - title: Template details
      required: [name, title, description, owner, kind]
      properties:
        name:
          title: Template ID
          type: string
          description: Folder name and metadata.name, e.g. "python-worker".
          pattern: "^[a-z][a-z0-9-]{2,39}$"
        title:
          title: Title shown in the portal
          type: string
        description:
          title: Description
          type: string
        owner:
          title: Owning team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        kind:
          title: What does it create?
          type: string
          enum: [service, website, library, documentation]
          default: service

  steps:
    - id: portal
      name: Look up the portal repo
      action: catalog:fetch
      input:
        entityRef: component:default/developer-portal

    - id: fetch
      name: Generate template folder
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./new
        values:
          name: ${{ parameters.name }}
          title: ${{ parameters.title }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          kind: ${{ parameters.kind }}
        # The new template's own skeleton is copied as-is (it is rendered later,
        # when someone uses the new template)
        copyWithoutTemplating:
          - templates/*/skeleton/**

    - id: pr
      name: Open pull request in the portal repo
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=${{ steps['portal'].output.entity.metadata.annotations['platform.lab/repo-owner'] }}&repo=${{ steps['portal'].output.entity.metadata.annotations['platform.lab/repo-name'] }}
        branchName: portal/template-${{ parameters.name }}
        title: "Add template: ${{ parameters.title }}"
        description: >-
          New template `${{ parameters.name }}` scaffolded from the portal. Fill in
          templates/${{ parameters.name }}/skeleton/ and the form in template.yaml,
          then merge to publish it.
        sourcePath: ./new

  output:
    links:
      - title: Pull request
        url: ${{ steps['pr'].output.remoteUrl }}
